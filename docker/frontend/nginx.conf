# HTTP: служебная проверка состояния и переадресация на HTTPS
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS: статика клиентского приложения и обратный прокси к серверу бизнес-логики
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /certs/frontend.crt;
    ssl_certificate_key /certs/frontend.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 11m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass https://backend_core:8000/api/;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name backend_core;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass https://backend_core:8000/health;
        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_name backend_core;
        proxy_ssl_server_name on;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
